name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting & Clippy
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Rust toolchain (rustfmt/clippy) + protoc are pre-installed on the self-hosted runner.
      - name: Run rustfmt
        run: cargo fmt --all -- --check
        env:
          CARGO_INCREMENTAL: 1

      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1

  elf:
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      # SP1 toolchain (cargo-prove) is pre-installed on the self-hosted runner.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify the SP1 Vector Binary
        run: |
          # Build the binaries
          cd program
          cargo-prove prove build --elf-name vector-elf --docker --tag v6.3.1 --output-directory ../elf
          cd ../
          # Check for any changes in the elf directory
          if [ -n "$(git status --porcelain elf/)" ]; then
            echo "❌ ELF files changed during build!"
            git diff elf/
            exit 1
          else
            echo "✅ ELF files remained unchanged"
          fi