name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"
  merge_group:

env:
  # The Rust version that docker/Dockerfile builds the operator with. Keep the two in step.
  # "stable" would move to each new release, and a new release can reject a dependency.
  RUST_VERSION: "1.89.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting & Clippy
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # protoc is pre-installed on the self-hosted runner. The Rust toolchain is installed here,
      # because the runner's default toolchain lost rustfmt and its cargo could not read a
      # version 4 Cargo.lock.
      - name: Install Rust
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run rustfmt
        run: cargo fmt --all -- --check
        env:
          CARGO_INCREMENTAL: 1

      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1

  elf:
    # Self-hosted runner: skip fork PRs (untrusted code); allow same-repo PRs, push, merge_group.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      # SP1 toolchain (cargo-prove) is pre-installed on the self-hosted runner. cargo-prove calls
      # `cargo metadata` with the default toolchain, which must read a version 4 Cargo.lock.
      - name: Install Rust
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify the SP1 Vector Binary
        run: |
          # Build the binaries
          cd program
          cargo-prove prove build --elf-name vector-elf --docker --tag v6.3.1 --output-directory ../elf
          cd ../
          # Check for any changes in the elf directory
          if [ -n "$(git status --porcelain elf/)" ]; then
            echo "❌ ELF files changed during build!"
            git diff elf/
            exit 1
          else
            echo "✅ ELF files remained unchanged"
          fi